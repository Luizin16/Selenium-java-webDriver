name: Testes E2E

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    # Regressão diária às 09:00 (horário de Brasília)
    - cron: "0 12 * * *"

jobs:
  regressao:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Rodar a regressão
        run: mvn -B test -Dheadless=true

      - name: Publicar relatório do Cucumber
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: target/reports/
